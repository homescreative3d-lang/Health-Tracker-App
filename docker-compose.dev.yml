services:
  postgres:
    image: postgres:16-alpine
    container_name: tended-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: tended_dev
      POSTGRES_USER: tended
      POSTGRES_PASSWORD: tended_local_only
    ports:
      - "5433:5432"
    volumes:
      - tended_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tended -d tended_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tended_postgres_dev_data:
