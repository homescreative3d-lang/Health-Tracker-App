name: CI
on: [push,pull_request]
jobs:
 frontend:
  runs-on: ubuntu-latest
  defaults: {run: {working-directory: frontend}}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: 20}
   - run: npm install
   - run: npm run build
 backend:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-dotnet@v4
     with: {dotnet-version: 8.0.x}
   - run: dotnet restore backend/HealthTracker.Api/HealthTracker.Api.csproj
   - run: dotnet build backend/HealthTracker.Api/HealthTracker.Api.csproj --no-restore
   - run: dotnet test backend/HealthTracker.Tests/HealthTracker.Tests.csproj